<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="Assets/favicon.svg" type="image/svg+xml" />
  <title>ENEM · Tópico</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    body .main { max-width: none; }
    .topico-shell { display: flex; flex-direction: column; gap: 1rem; padding-bottom: 110px; }
    .topico-hero,
    .topico-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .topico-hero {
      padding: 1.4rem 1.6rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
    }
    .topico-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .topico-tag {
      font-size: 11px;
      color: var(--text3);
      font-family: var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topico-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.03em;
    }
    .topico-desc {
      color: var(--text2);
      font-size: 13px;
      max-width: 70ch;
    }
    .topico-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .topico-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }
    .personal-tip {
      border: 1px solid rgba(200,241,53,.2);
      background: rgba(200,241,53,.055);
      color: var(--text2);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .personal-tip strong {
      color: var(--accent);
    }
    .tstat {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem 1rem;
    }
    .tstat-lbl {
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-family: var(--mono);
      margin-bottom: 4px;
    }
    .tstat-val { font-size: 16px; font-weight: 500; }
    .mastery-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .mastery-btn {
      border: 1px solid var(--border2);
      background: var(--bg2);
      color: var(--text2);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .mastery-btn:hover {
      background: var(--bg3);
      color: var(--text);
      transform: translateY(-1px);
    }
    .mastery-btn.d1.active {
      color: var(--red);
      border-color: rgba(255,94,94,.45);
      background: rgba(255,94,94,.08);
    }
    .mastery-btn.d2.active {
      color: var(--amber);
      border-color: rgba(245,166,35,.45);
      background: rgba(245,166,35,.08);
    }
    .mastery-btn.d3.active {
      color: var(--green);
      border-color: rgba(74,222,128,.45);
      background: rgba(74,222,128,.08);
    }
    .mastery-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      width: fit-content;
    }
    .mastery-badge.none {
      color: var(--state-neutral);
      border: 1px solid var(--border2);
      background: var(--bg3);
    }
    .mastery-badge.d1 {
      color: var(--state-critical);
      border: 1px solid rgba(239,68,68,.35);
      background: rgba(239,68,68,.08);
    }
    .mastery-badge.d2 {
      color: var(--state-medium);
      border: 1px solid rgba(250,204,21,.35);
      background: rgba(250,204,21,.08);
    }
    .mastery-badge.d3 {
      color: var(--state-low);
      border: 1px solid rgba(74,222,128,.35);
      background: rgba(74,222,128,.08);
    }
    .badge-difficulty {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 6px 10px;
      border: 1px solid var(--border2);
      font-size: 13px;
      width: fit-content;
    }
    .badge-difficulty.nao_avaliado {
      color: var(--state-neutral);
      border-color: rgba(139,139,139,.35);
      background: rgba(139,139,139,.06);
    }
    .badge-difficulty.baixa {
      color: var(--state-low);
      border-color: rgba(74,222,128,.45);
      background: rgba(74,222,128,.08);
    }
    .badge-difficulty.media {
      color: var(--state-medium);
      border-color: rgba(250,204,21,.45);
      background: rgba(250,204,21,.08);
    }
    .badge-difficulty.alta {
      color: var(--state-high);
      border-color: rgba(251,146,60,.45);
      background: rgba(251,146,60,.08);
    }
    .badge-difficulty.critica {
      color: var(--state-critical);
      border-color: rgba(239,68,68,.45);
      background: rgba(239,68,68,.08);
    }
    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab.ativo {
      border-color: rgba(200,241,53,.24);
      color: var(--accent);
      background: rgba(200,241,53,.06);
    }
    .tab-panel { display: none; }
    .tab-panel.ativo { display: block; }
    .topico-card { padding: 1.2rem 1.3rem; }
    body.topic-notes-mode .sidebar {
      width: 72px;
      padding: 1.25rem .7rem;
      gap: 1.25rem;
      transition: width .22s ease, padding .22s ease, transform .22s ease;
    }
    body.topic-notes-mode .sidebar-logo {
      justify-content: center;
      font-size: 0;
    }
    body.topic-notes-mode .nav-label {
      display: none;
    }
    body.topic-notes-mode .nav-links a {
      justify-content: center;
      gap: 0;
      padding: 10px;
      font-size: 0;
    }
    body.topic-notes-mode .nav-links a .nav-icon {
      width: 18px;
      height: 18px;
    }
    body.topic-notes-mode .main {
      margin-left: 72px;
      padding: 1.35rem clamp(1rem, 2.6vw, 2.75rem) 4rem;
    }
    .topico-card.notes-expanded {
      padding: 0;
      background: transparent;
      border-color: transparent;
    }
    .topico-card.notes-expanded .tabs {
      position: sticky;
      top: 0;
      z-index: 15;
      padding: 0 0 14px;
      margin-bottom: 16px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      border-radius: 0;
      background: rgba(15,15,15,.82);
      backdrop-filter: blur(16px);
    }
    body.topic-workspace-mode .topico-shell {
      gap: .75rem;
    }
    body.topic-workspace-mode .topico-stats,
    body.topic-workspace-mode .personal-tip {
      display: none !important;
    }
    body.topic-workspace-mode .topico-hero {
      padding: .75rem 0 .25rem;
      border-color: transparent;
      background: transparent;
      align-items: center;
    }
    body.topic-workspace-mode .topico-desc {
      display: none;
    }
    body.topic-workspace-mode .topico-title {
      font-size: 22px;
    }
    body.topic-workspace-mode .topico-actions .btn:nth-child(3) {
      display: none;
    }
    body.notes-immersive-mode .sidebar {
      display: none;
      pointer-events: none;
    }
    body.notes-immersive-mode .main {
      margin-left: 0;
      padding: .85rem clamp(1rem, 3vw, 2.5rem) 3.5rem;
    }
    body.notes-immersive-mode .back-link,
    body.notes-immersive-mode .topico-hero {
      display: none;
    }
    body.notes-immersive-mode .topico-card.notes-expanded .tabs {
      top: 10px;
    }
    body.topic-notes-mode .focus-mini-bar {
      width: min(860px, calc(100vw - 28px));
      min-height: 52px;
      bottom: 16px;
      padding: 9px 12px;
      background: rgba(15,15,15,.78);
      border-color: rgba(255,255,255,.08);
      border-radius: 14px;
      box-shadow: 0 14px 42px rgba(0,0,0,.28);
    }
    body.topic-notes-mode .focus-mini-left small,
    body.topic-notes-mode #focus-mini-save {
      display: none;
    }
    body.topic-notes-mode .focus-mini-left strong {
      font-size: 16px;
    }
    body.topic-notes-mode .focus-mini-actions {
      gap: 6px;
    }
    .note-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 14px;
      margin-bottom: 14px;
    }
    .note-kicker {
      font-size: 10px;
      color: var(--text3);
      font-family: var(--mono);
      letter-spacing: .11em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .note-head h3 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.02em;
    }
    .note-toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 10px;
      margin-bottom: 12px;
      background: rgba(255,255,255,.015);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .note-tool {
      border: 1px solid var(--border2);
      background: var(--bg2);
      color: var(--text2);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 11px;
      font-family: var(--font);
      cursor: pointer;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .note-tool:hover {
      color: var(--accent);
      border-color: rgba(200,241,53,.35);
      background: rgba(200,241,53,.06);
    }
    .note-tool.primary {
      color: var(--accent);
      border-color: rgba(200,241,53,.32);
      background: rgba(200,241,53,.07);
    }
    .note-tool.compact {
      padding-inline: 10px;
      min-width: 34px;
      justify-content: center;
    }
    .note-toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 2px;
    }
    .note-blocks {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .note-block {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
    }
    .note-block.resumo {
      border-color: rgba(200,241,53,.32);
    }
    .note-block.ideia {
      border-color: rgba(96,165,250,.34);
    }
    .note-block.exemplo {
      border-color: rgba(96,165,250,.28);
    }
    .note-block.formula {
      border-color: rgba(245,166,35,.30);
    }
    .note-block.duvida {
      border-color: rgba(180,130,255,.28);
    }
    .note-block.erro {
      border-color: rgba(255,94,94,.34);
    }
    .note-block.atencao {
      border-color: rgba(251,146,60,.38);
    }
    .note-block.enem {
      border-color: rgba(167,139,250,.38);
    }
    .note-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.14);
    }
    .note-block-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }
    .note-block-title i {
      width: 14px;
      height: 14px;
      color: var(--accent);
    }
    .note-block-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .note-block-action {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text3);
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .note-block-action i {
      width: 13px;
      height: 13px;
    }
    .note-block-action:hover {
      color: var(--text);
      background: var(--bg4);
    }
    .note-block-action.danger:hover {
      color: var(--red);
      border-color: rgba(255,94,94,.35);
    }
    .note-block-action:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .note-block-textarea {
      width: 100%;
      min-height: 92px;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.7;
    }
    .note-empty-state {
      border: 1px dashed var(--border2);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
    }
    .note-empty-state strong {
      display: block;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .anotacao-area,
    .questao-form textarea,
    .video-input,
    .obsidian-import-area {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
    }
    .anotacao-area,
    .questao-form textarea,
    .obsidian-import-area {
      padding: 12px 14px;
      min-height: 160px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.7;
    }
    .note-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 9px;
    }
    .note-helper {
      color: var(--text3);
      font-size: 11px;
      font-family: var(--mono);
    }
    .mastery-box {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,.012);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .mastery-help {
      color: var(--text2);
      font-size: 12px;
    }
    .mastery-box .mastery-row {
      margin-top: 0;
    }
    .video-input {
      padding: 10px 12px;
      font-family: var(--font);
      font-size: 13px;
    }
    .anotacao-area:focus,
    .questao-form textarea:focus,
    .video-input:focus,
    .obsidian-import-area:focus {
      border-color: var(--accent);
    }
    .video-add-row,
    .obsidian-vault-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: .9rem;
    }
    .video-add-row input,
    .obsidian-vault-row input { flex: 1; min-width: 220px; }
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .video-card,
    .questao-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .video-card iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      display: block;
    }
    .video-info,
    .questao-item {
      padding: 12px;
    }
    .video-info {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }
    .video-title { font-size: 12px; color: var(--text2); }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      padding: 2px;
    }
    .icon-btn:hover { color: var(--red); }
    .questao-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
    .questao-enunciado { font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
    .questao-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .practice-card {
      background:
        linear-gradient(135deg, rgba(200,241,53,.08), rgba(96,165,250,.04)),
        var(--bg3);
      border: 1px solid rgba(200,241,53,.18);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }
    .practice-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .practice-kicker {
      color: var(--text3);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .practice-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .practice-title i { color: var(--accent); }
    .practice-sub { color: var(--text2); font-size: 12px; }
    .practice-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 11px;
      background: rgba(15,15,15,.25);
    }
    .quiz-shell {
      display: none;
      margin-top: 1rem;
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 1rem;
    }
    .quiz-shell.open { display: block; }
    .quiz-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .quiz-progress-text {
      color: var(--text3);
      font-family: var(--mono);
      font-size: 11px;
    }
    .quiz-question {
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 12px;
    }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-option {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: flex-start;
      text-align: left;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .quiz-option:hover { border-color: var(--border2); background: var(--bg4); }
    .quiz-option:disabled { cursor: default; opacity: 1; }
    .quiz-option.correct { border-color: rgba(74,222,128,.5); background: rgba(74,222,128,.09); }
    .quiz-option.wrong { border-color: rgba(255,94,94,.5); background: rgba(255,94,94,.08); }
    .quiz-letter {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg3);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 12px;
      border: 1px solid var(--border2);
    }
    .quiz-option.correct .quiz-letter { color: #0f0f0f; background: var(--green); border-color: var(--green); }
    .quiz-option.wrong .quiz-letter { color: #0f0f0f; background: var(--red); border-color: var(--red); }
    .quiz-feedback {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--bg2);
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.6;
    }
    .quiz-feedback.open { display: block; }
    .quiz-feedback.correct { border-color: rgba(74,222,128,.35); }
    .quiz-feedback.wrong { border-color: rgba(255,94,94,.35); }
    .quiz-result {
      display: none;
      margin-top: 12px;
      padding: 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .quiz-result.open { display: block; }
    .quiz-result strong { color: var(--accent); }
    .manual-questions {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .manual-questions summary {
      cursor: pointer;
      color: var(--text2);
      font-size: 12px;
      font-family: var(--mono);
    }
    .manual-questions[open] summary { margin-bottom: 12px; }
    .quiz-math { overflow-x: auto; }
    .quiz-math .katex { color: var(--text); }
    .obsidian-section { display: flex; flex-direction: column; gap: 12px; }
    .obsidian-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
